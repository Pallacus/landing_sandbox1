<head>

   <title>Document</title>
   <style>
      * {
         margin: 0;
         padding: 0;
         box-sizing: border-box;
         transition: 0.5s;
      }

      html {
         background-color: rgb(0, 0, 0);
         color: rgb(0, 96, 255);
         font-family: monospace;
         font-size: 2rem;
         font-weight: bold;
      }

      nav{
         padding: 3rem;
      }

      a:link,
      a:visited {
         color: rgb(0, 96, 255);
      }

      a:hover {
         color: rgb(0, 127, 255);
      }

      a:active {
         color: orange;
      }

      body {
         padding: 2rem;
      }
   </style>
</head>
